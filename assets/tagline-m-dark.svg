<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" role="img" aria-label="I like to make stuff — particularly when it comes to my homelab.">
  <style>
  .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
  <g transform="translate(0 22)"><g class="rise">
  <rect x="7.5" y="7.5" width="592" height="206" fill="#525252"/>
  <rect x="0.5" y="0.5" width="591" height="205" fill="#040507" stroke="#525252"/>
  <rect x="0.5" y="0.5" width="591" height="60" fill="#1c1c1c" stroke="#525252"/>
  <text x="26" y="39.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="26" fill="#AEB5B8" textLength="156.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ cat motd</text>
  <rect x="188.0" y="17.0" width="14" height="28" fill="#AEB5B8"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
